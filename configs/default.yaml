vm:
  name: alfaos
  cpu: 4
  ram_mb: 4096
  disk_gb: 32
  network: default
  graphics: none

debian:
  version: ""   # auto-discover latest; set e.g. "13.6.0" to pin a release
  arch: amd64
  iso_base_url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd"
  iso_hash_url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS"
  mirror: "http://deb.debian.org/debian"

alfaos:
  username: alfaos
  password: alfaos
  hostname: alfaos
  theme: Alfa      # Alfa (red accents), Arc, Dracula, or Gruvbox
  icons: Papirus-Dark
  wallpaper: alfaos3.png
  terminal: tilix      # default terminal (tilix | xfce4-terminal)
  browser: true        # firefox-esr
  plank: true

rdp:
  port: 3389
  width: 1920
  height: 1080
  expose: true       # forward 0.0.0.0:3389 on host → VM (for VPS remote RDP)
  bind_host: "0.0.0.0"

# Host listens on RDP even when the VM is off. An incoming connection starts the VM;
# after idle_shutdown_minutes with no RDP sessions the VM is shut down (RAM freed).
power:
  idle_shutdown_minutes: 15   # 0 = never auto-shutdown
  wake_on_rdp: true

# AdGuard DNS — blocks ads, trackers, and phishing; no query logs (https://adguard-dns.io)
dns:
  servers:
    - 94.140.14.14
    - 94.140.15.15
    - 9.9.9.11   # Quad9 backup (malware block + DNSSEC)

paths:
  iso_cache: /var/lib/alfaos/iso
  preseed_dir: /var/lib/alfaos/preseed
  state_dir: /var/lib/alfaos/state
