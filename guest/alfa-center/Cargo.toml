[package]
name = "alfa-center"
version = "0.1.0"
edition = "2021"
description = "ALFAOS settings UI for the guest desktop"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
