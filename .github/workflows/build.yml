name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify build
        run: |
          set -euo pipefail
          go test ./...
          VERSION="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o /tmp/alfaos-linux-amd64 ./cmd/alfaos/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="${LDFLAGS}" -o /tmp/alfaos-linux-arm64 ./cmd/alfaos/
          /tmp/alfaos-linux-amd64 version
          file /tmp/alfaos-linux-amd64 /tmp/alfaos-linux-arm64
